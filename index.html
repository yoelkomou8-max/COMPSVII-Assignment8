
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Player Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container py-5">
        <div class="quiz-card mx-auto p-4">

            <h1 class="text-center">⚽ What Type of Soccer Player Are You?</h1>
            <p class="text-center">Answer these 4 questions to discover your soccer personality!</p>

            <form id="quiz-form">

                <div class="question-block">
                    <h3>1. What's your biggest strength?</h3>
                    <label><input type="radio" name="q1" value="speed"> My speed</label>
                    <label><input type="radio" name="q1" value="playmaker"> My passing</label>
                    <label><input type="radio" name="q1" value="scorer"> My finishing</label>
                    <label><input type="radio" name="q1" value="defender"> My defending</label>
                </div>

                <div class="question-block">
                    <h3>2. What do you enjoy most?</h3>
                    <label><input type="radio" name="q2" value="speed"> Running past defenders</label>
                    <label><input type="radio" name="q2" value="playmaker"> Creating chances</label>
                    <label><input type="radio" name="q2" value="scorer"> Scoring goals</label>
                    <label><input type="radio" name="q2" value="defender"> Stopping attacks</label>
                </div>

                <div class="question-block">
                    <h3>3. What's your favorite position?</h3>
                    <label><input type="radio" name="q3" value="speed"> Winger</label>
                    <label><input type="radio" name="q3" value="playmaker"> Midfielder</label>
                    <label><input type="radio" name="q3" value="scorer"> Striker</label>
                    <label><input type="radio" name="q3" value="defender"> Defender</label>
                </div>

                <div class="question-block">
                    <h3>4. Describe yourself:</h3>
                    <label><input type="radio" name="q4" value="speed"> Fast and explosive</label>
                    <label><input type="radio" name="q4" value="playmaker"> Creative and intelligent</label>
                    <label><input type="radio" name="q4" value="scorer"> Confident in front of goal</label>
                    <label><input type="radio" name="q4" value="defender"> Strong and disciplined</label>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success">
                        Show My Results
                    </button>
                </div>

            </form>

            <div id="result-container" class="text-center mt-4"></div>

        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
